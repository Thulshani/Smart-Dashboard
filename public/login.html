<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Dev &amp; QA Performance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="login-body">

<div class="login-card">
  <div class="brand" style="justify-content:center; margin-bottom: 22px;">
    <span class="brand-mark">◧</span>
    <div>
      <h1 style="margin:0;">Dev &amp; QA Performance</h1>
      <p class="brand-sub" style="margin:2px 0 0;">Sign in to continue</p>
    </div>
  </div>

  <form id="authForm" class="login-form">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required />

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />

    <p class="login-error" id="loginError"></p>

    <button type="submit" id="submitBtn">Sign in</button>
  </form>

  <p class="login-footnote">Don't have an account? Ask your admin to create one for you.</p>
</div>

<script src="login.js"></script>
</body>
</html>
